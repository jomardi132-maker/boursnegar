server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name boursnegar.ir www.boursnegar.ir _;

    # Cloudflare Flexible sends the original HTTPS scheme in CF-Visitor while
    # connecting to this origin over HTTP. Redirect only direct/plain HTTP.
    if ($http_cf_visitor !~* '"scheme":"https"') {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boursnegar.ir www.boursnegar.ir;

    ssl_certificate /etc/letsencrypt/live/boursnegar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boursnegar.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
